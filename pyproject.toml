[project]
name = "weather-forecaster"
version = "0.1.0"
description = "A neural network that forecasts global weather, scored on WeatherBench"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "certifi",
    "gcsfs",
    "numpy",
    "zarr",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weather_forecaster"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
